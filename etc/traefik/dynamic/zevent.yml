http:
  middlewares:
    # Every request to the dashboards must carry kiosk=1: Grafana only hides its chrome for the exact
    # value "1", and it rewrites the URL to "kiosk=" (empty) while running, which shows the header,
    # search, sign-in and share buttons again on reload. Dashboards: zevent-public (main stats),
    # zevent-live-public, zevent-insights-public, zevent-streamer-public. The optional capture selects the dashboard; the bare
    # host has no capture and lands on the main one. Go regexp has no lookahead, so "no kiosk in the
    # query" is spelled out token by token.
    #
    # 1. bare host, or dashboard path whose query has no "kiosk" at all -> add kiosk=1
    zevent-public-home:
      redirectRegex:
        regex: "^https?://zevent\\.jubnl\\.ch(?:/|/d/zevent-((?:live|insights|streamer)-)?public(?:/[^?]*)?)?(?:\\?((?:[^k]|k[^i]|ki[^o]|kio[^s]|kios[^k])*(?:k|ki|kio|kios)?))?$"
        replacement: "https://zevent.jubnl.ch/d/zevent-${1}public?kiosk=1&${2}"
        permanent: false
    # 2. dashboard path whose query has a "kiosk" param with any value but 1 ("kiosk", "kiosk=", "kiosk=tv") -> kiosk=1
    zevent-force-kiosk:
      redirectRegex:
        regex: "^(https?://zevent\\.jubnl\\.ch/d/zevent-(?:(?:live|insights|streamer)-)?public(?:/[^?]*)?\\?(?:.*&)?)kiosk(?:=(?:[^1&][^&]*|1[^&]+)?)?(&.*)?$"
        replacement: "${1}kiosk=1${2}"
        permanent: false
