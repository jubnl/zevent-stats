# Caching hop between Traefik and the public Grafana. Grafana panels fetch their data with POST
# /api/ds/query, which Cloudflare never caches; nginx caches those responses here, keyed on the request
# body (the SQL, time range and resolution), so each distinct panel query hits Postgres once.
# The dashboards are frozen after the event, so the entries are kept for 30 days. After a change to the
# data (a recompute) purge the cache: docker compose exec nginx sh -c 'rm -rf /var/cache/nginx/zevent/*'
# (a change to a panel's SQL needs no purge: a different body is a different key).
# This file is bind-mounted into the container: after editing it run `docker compose up -d --force-recreate nginx`
# (an in-place edit gets a new inode, and a plain `nginx -s reload` still reads the old one).
proxy_cache_path /var/cache/nginx/zevent levels=1:2 keys_zone=zevent:64m max_size=4g inactive=30d use_temp_path=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3000;
    server_name _;

    # Grafana behind a proxy: pass the host on with its port ($http_host): Grafana Live checks the Origin
    # against it, and on a non-default port a bare $host fails that check
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_http_version 1.1;

    # Panel and variable queries: cached, POST included. $request_body is only available when the
    # whole body fits in memory, hence the buffer size (a query body is a few KB).
    location = /api/ds/query {
        client_max_body_size    1m;
        client_body_buffer_size 256k;
        proxy_pass http://grafana-public:3000;
        proxy_cache            zevent;
        proxy_cache_methods    GET HEAD POST;
        proxy_cache_key        "$request_method|$request_uri|$request_body";
        proxy_ignore_headers   Cache-Control Expires Set-Cookie Vary;   # Grafana says no-store; we know better
        proxy_hide_header      Set-Cookie;
        proxy_cache_valid      200 30d;
        proxy_cache_lock       on;                 # one origin fetch per key when many viewers arrive at once
        proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
        proxy_read_timeout     120s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Everything else straight through (Grafana Live uses a WebSocket on /api/live/ws). A location with
    # its own proxy_set_header inherits none from the server block, so the common headers are repeated:
    # without Host, Grafana rejects the WebSocket (origin check).
    location / {
        proxy_pass http://grafana-public:3000;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
